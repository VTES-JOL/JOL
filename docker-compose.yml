services:
  prod:
    image: tomcat:9-jdk21-corretto
    container_name: prod
    networks:
      - web
    labels:
      - "traefik.http.routers.prod.entrypoints=websecure"
      - "traefik.http.routers.prod.rule=Host(`www.deckserver.net`) || Host(`deckserver.net`)"
      - "traefik.http.routers.prod.tls.certresolver=myresolver"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.regex=^(https?://[^/]+)/$$"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.replacement=$${1}/jol/"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.prod-root.entrypoints=websecure"
      - "traefik.http.routers.prod-root.rule=(Host(`www.deckserver.net`) || Host(`deckserver.net`)) && Path(`/`)"
      - "traefik.http.routers.prod-root.tls.certresolver=myresolver"
      - "traefik.http.routers.prod-root.middlewares=prod-root-redirect"
    env_file: .keys
    environment:
      JOL_DATA: /data
      TYPE: "prod"
      JDK_JAVA_OPTIONS: -Djava.security.egd=file:/dev/./urandom -Xmx2048m
    volumes:
      - prod-data:/data
      - prod-app:/usr/local/tomcat/webapps
  test:
    image: tomcat:9-jdk21-corretto
    container_name: test
    networks:
      - web
    labels:
      - "traefik.http.routers.test.entrypoints=websecure"
      - "traefik.http.routers.test.rule=Host(`test.deckserver.net`)"
      - "traefik.http.routers.test.tls.certresolver=myresolver"
    env_file: .keys
    environment:
      JOL_DATA: /data
      TYPE: "test"
      _JAVA_OPTIONS: -Djava.security.egd=file:/dev/./urandom
    volumes:
      - test-data:/data
      - test-app:/usr/local/tomcat/webapps
  static:
    image: nginx
    container_name: static
    networks:
      - web
    labels:
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.rule=Host(`static.deckserver.net`)"
      - "traefik.http.routers.static.tls.certresolver=myresolver"
    volumes:
      - static-data:/usr/share/nginx/html
networks:
  web:
    external: true
volumes:
  prod-data:
    external: true
  prod-app:
    external: true
  test-data:
    external: true
  test-app:
    external: true
  static-data:
    external: true