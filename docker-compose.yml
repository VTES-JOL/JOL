services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    networks:
      - web
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@deckserver.net"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
  prod:
    image: tomcat:9-jdk21-corretto
    container_name: prod
    networks:
      - web
    labels:
      - "traefik.http.routers.prod.entrypoints=websecure"
      - "traefik.http.routers.prod.rule=Host(`www.deckserver.net`) || Host(`deckserver.net`)"
      - "traefik.http.routers.prod.tls.certresolver=myresolver"
    env_file: .keys
    environment:
      JOL_LOGS: /data
      VAPID_KEY_FILE: /data/vapid_private.pem
      TYPE: "prod"
      JDK_JAVA_OPTIONS: -Djava.security.egd=file:/dev/./urandom -Xmx2048m
      JOL_DB_URL: jdbc:postgresql://prod-db:5432/jol
      JOL_DB_USER: jol
      JOL_DB_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD in .env}
    depends_on:
      prod-db:
        condition: service_healthy
    volumes:
      - prod-data:/data
      - prod-app:/usr/local/tomcat/webapps
  prod-db:
    image: postgres:16
    container_name: prod-db
    networks:
      - web
    environment:
      POSTGRES_DB: jol
      POSTGRES_USER: jol
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD in .env}
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jol -d jol"]
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  web:
    external: true
volumes:
  prod-data:
    external: true
  prod-app:
    external: true
  prod-db-data:
    external: true
  letsencrypt:
    external: true