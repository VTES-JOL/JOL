services:
  prod:
    image: tomcat:9-jdk21-corretto
    container_name: prod
    networks:
      - web
    labels:
      - "traefik.http.routers.prod.entrypoints=websecure"
      - "traefik.http.routers.prod.rule=Host(`www.deckserver.net`) || Host(`deckserver.net`)"
      - "traefik.http.routers.prod.tls.certresolver=myresolver"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.regex=^(https?://[^/]+)/$$"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.replacement=$${1}/jol/"
      - "traefik.http.middlewares.prod-root-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.prod-root.entrypoints=websecure"
      - "traefik.http.routers.prod-root.rule=(Host(`www.deckserver.net`) || Host(`deckserver.net`)) && Path(`/`)"
      - "traefik.http.routers.prod-root.tls.certresolver=myresolver"
      - "traefik.http.routers.prod-root.middlewares=prod-root-redirect"
    env_file: .keys
    environment:
      TYPE: "prod"
      JDK_JAVA_OPTIONS: -Djava.security.egd=file:/dev/./urandom -Xmx2048m
      JOL_DB_URL: jdbc:postgresql://prod-db:5432/jol
      JOL_DB_USER: jol
      JOL_DB_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD in .env}
      VAPID_KEY_FILE: /data/vapid_private.pem
      JWT_SECRET_FILE: /data/jwt_secret.key
    depends_on:
      prod-db:
        condition: service_healthy
    volumes:
      - prod-data:/data
      - prod-app:/usr/local/tomcat/webapps
  prod-db:
    image: postgres:16
    container_name: prod-db
    networks:
      - web
    environment:
      POSTGRES_DB: jol
      POSTGRES_USER: jol
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD in .env}
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jol -d jol"]
      interval: 5s
      timeout: 5s
      retries: 5
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test
    networks:
      - web
    labels:
      - "traefik.http.routers.test.entrypoints=websecure"
      - "traefik.http.routers.test.rule=Host(`test.deckserver.net`)"
      - "traefik.http.routers.test.tls.certresolver=myresolver"
      - "traefik.http.services.test.loadbalancer.server.port=8080"
    env_file: .keys
    environment:
      TYPE: "test"
      JDK_JAVA_OPTIONS: -Djava.security.egd=file:/dev/./urandom
      JOL_DB_URL: jdbc:postgresql://prod-db:5432/jol
      JOL_DB_USER: jol
      JOL_DB_PASSWORD: ${PROD_DB_PASSWORD:?set PROD_DB_PASSWORD in .env}
      VAPID_KEY_FILE: /data/vapid_private.pem
      JWT_SECRET_FILE: /data/jwt_secret.key
    depends_on:
      prod-db:
        condition: service_healthy
    volumes:
      - test-data:/data
networks:
  web:
    external: true
volumes:
  prod-data:
    external: true
  prod-app:
    external: true
  test-data:
    external: true
  test-app:
    external: true
  prod-db-data:
    external: true