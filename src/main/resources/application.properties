# Quarkus-managed JPA layer. Replaces the old src/main/resources/META-INF/
# persistence.xml + JpaFactory's hand-rolled HikariDataSource/Flyway
# bootstrap. Entities are auto-discovered on the classpath — no explicit
# <class> list needed the way persistence.xml required.
#
# Env var names/defaults are unchanged from JpaFactory's previous
# System.getenv() lookups, so the table in CLAUDE.md stays accurate.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${JOL_DB_USER:jol}
quarkus.datasource.password=${JOL_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${JOL_DB_URL:jdbc:postgresql://localhost:5432/jol}
quarkus.datasource.jdbc.max-size=${JOL_DB_POOL_SIZE:10}

# Without this, Quarkus's Hibernate ORM extension auto-detects ANY
# persistence.xml reachable on the classpath — including
# src/test/resources/META-INF/persistence.xml's H2 test units, which
# `quarkus:dev` puts on the classpath alongside main (for continuous
# testing). Confirmed empirically: without this flag, dev mode logged
# "A legacy persistence.xml file is present... any configuration of the
# Hibernate ORM extension will be ignored" and configured itself from the
# test units instead of the settings below.
quarkus.hibernate-orm.persistence-xml.ignore=true

# Schema is owned by Flyway; matches the old hibernate.hbm2ddl.auto=validate.
quarkus.hibernate-orm.database.generation=validate

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Dev-only HTTPS: AuthService's cookies are unconditionally Secure. Prod
# doesn't need this — Traefik terminates TLS in front of the container (see
# docker-compose.yml) and the app itself only ever spoke plain HTTP behind
# it, same as it did under Tomcat. Local dev has no Traefik, so this
# simulates it, exactly like the old frontend/vite.config.ts's
# @vitejs/plugin-basic-ssl did for the pre-Quinoa dev server. No built-in
# self-signed cert generation in this Quarkus version, so this was generated
# by hand:
#   keytool -genkeypair -alias localhost -keyalg RSA -keysize 2048 -validity 3650 \
#     -keystore dev-keystore.p12 -storetype PKCS12 -storepass changeit \
#     -dname "CN=localhost" -ext "SAN=dns:localhost,ip:127.0.0.1"
%dev.quarkus.http.ssl-port=8443
%dev.quarkus.http.insecure-requests=disabled
%dev.quarkus.http.ssl.certificate.key-store-file=dev-keystore.p12
%dev.quarkus.http.ssl.certificate.key-store-file-type=PKCS12
%dev.quarkus.http.ssl.certificate.key-store-password=changeit

# Context path — the real app's fixed /jol.
quarkus.http.root-path=/jol

# MicroProfile-JWT (quarkus-smallrye-jwt). The access token is an RS256 JWT
# minted/verified by net.deckserver.services.TokenService (via jose4j, so it
# works in service-level tests that boot no Quarkus runtime); these settings
# wire Quarkus's own cookie-sourced JWT mechanism to the SAME public key and
# issuer, so a request's SecurityIdentity (and therefore @RolesAllowed, with
# roles taken from the token's "groups" claim) lines up with what
# SecurityFilter derives. The public-key location defaults to the committed
# dev key on the classpath; prod sets JWT_PUBLIC_KEY_LOCATION to a file: URL
# (and JWT_PRIVATE_KEY_FILE / JWT_PUBLIC_KEY_FILE for TokenService itself).
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:jwt/jwt-dev-public.pem}
mp.jwt.verify.issuer=https://deckserver.net/jol
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=jol_at
# Lazy auth: the identity is resolved by CookieJwtAuthMechanism only when a
# permission policy / @RolesAllowed actually demands it (never just because a
# cookie is present), so anonymous hits on unsecured paths stay cheap and the
# silent refresh-token rotation only runs on real API traffic.
quarkus.http.auth.proactive=false

# Replaces SecurityFilter's blanket "401 unless authenticated" + PUBLIC_PATHS.
# Paths match the full request path (root-path /jol included). login/register/
# refresh/logout run before or around a valid token; config carries only the
# non-secret values the login page needs pre-session.
quarkus.http.auth.permission.public.paths=/jol/api/auth/*,/jol/api/config,/jol/api/metrics/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/jol/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Frontend (Quinoa). Lives at src/main/webui, Quinoa's own default ui-dir —
# no override needed.
# (Originally kept at the old repo-root frontend/ path at first to limit the
# blast radius of the move; moved here afterward once Quinoa was already
# proven working, updating the handful of things that assumed its
# old depth from repo root — serveCardAssets.ts's static/ path,
# playwright.config.ts, READMEs. See git history for that move.)
#
# Quinoa's own Node download broke against this app's Vite 8/rolldown-vite
# (wrong native binding architecture, and below Vite 8's minimum Node
# version besides). Falls back
# to whatever Node is already on the developer's PATH, same as the old
# frontend-maven-plugin conceptually did by installing its own pinned one,
# except this actually works.
quarkus.quinoa.package-manager-install=false
# Default (auto-detect) mis-defers to Quarkus's REST layer for client routes
# like /lobby when Vite's own dev-mode SPA fallback answers first. Direct
# mode fixes it without breaking REST endpoints served from the same root path.
quarkus.quinoa.enable-spa-routing=true

# Root console logging — equivalent settings to log4j2.xml's Root/Console
# appender (level INFO, pattern "%d %-5p %c{1} - %m%n"), which turned out to
# be dead config post-migration: almost all app logging goes through SLF4J,
# and org.jboss.slf4j:slf4j-jboss-logmanager (pulled in transitively by
# Quarkus) wins the SLF4J-provider race over log4j2's own
# log4j-slf4j2-impl binding — confirmed by the console's actual output
# format (JBoss LogManager's, not log4j2's PatternLayout). JBoss
# LogManager's PatternFormatter accepts the same %d/%p/%c{n}/%m/%n
# conversion characters log4j2 does, so the pattern string carries over
# directly. quarkus.log.level's INFO default already matched the old
# Root level="INFO" with no change needed; set explicitly here for parity.
#
# log4j2.xml itself is still required and still active for GameModel's
# METRICS/COMMANDS loggers, which call org.apache.logging.log4j.LogManager
# directly (bypassing SLF4J entirely) to get log4j2's per-game dynamic file
# routing (RoutingAppender keyed on ThreadContext) — Quarkus's own logging
# has no equivalent for that, so it isn't part of this migration.
quarkus.log.level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %c{1} - %m%n

# Scheduled jobs — net.deckserver.jobs.ScheduledJobs, the Quarkus replacement
# for the ScheduledExecutorService wiring in the old JolApplicationInitializer.
# Disabled under the %test profile so @QuarkusTest runs never fire them; the
# job bodies also early-return when ENABLE_TEST_MODE is set (service-level
# tests boot no Quarkus runtime, so the scheduler never starts there anyway).
%test.quarkus.scheduler.enabled=false
