<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>V:TES Online</title>
    <!--
      flag-icons drives CountryFlag's country glyphs; the IM Fell English
      webfont is used by theme.css's heading/nav rules. App-authored CSS is
      plain Vite-bundled imports (see src/main.tsx and co-located .css files).
      Bootstrap CSS was removed in the Tailwind migration — see
      src/styles/tailwind.css.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
    <link rel="shortcut icon" href="https://static.deckserver.net/assets/images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=IM+Fell+English" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Pre-paint the hinted theme before the bundle loads so a reload / the
      // login page don't flash the wrong theme. This is only a hint — the
      // authenticated shell reconciles it against NavBean.theme once /nav
      // resolves. Mirrors the apply logic in src/theme.ts — keep in sync.
      (function () {
        try {
          var t = localStorage.getItem('jol-theme');
          if (t === 'dark') t = 'amethyst'; // legacy hint value
          var known = ['light', 'amethyst', 'candlelit', 'oxblood', 'nightshade'];
          if (known.indexOf(t) === -1) t = 'light';
          document.body.dataset.theme = t;
          if (t !== 'light') document.body.setAttribute('data-bs-theme', 'dark');
        } catch (e) {
          /* storage unavailable — render light */
          document.body.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
