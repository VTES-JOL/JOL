name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  # quarkus.quinoa.package-manager-install=false (application.properties) —
  # Quinoa uses whatever Node is already on PATH rather than installing its
  # own pinned one, so every job that triggers a Quinoa build (package; not
  # backend-test, which never touches Quinoa/frontend at all) needs
  # setup-node too, matching this version.
  NODE_VERSION: '22.17.0'

jobs:
  backend-test:
    name: Backend tests (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # CardService falls back to static/secured/cards.json (gitignored — it's
      # regenerated locally by the CardDatabaseBuilder Builder-tagged test,
      # which needs network access this runner doesn't have) whenever the
      # CloudFront fetch above it fails, which it always does here since
      # KEY_ID/KEY_FILE/BASE_URL aren't set. Stage a small curated fixture —
      # just the cards test fixture data under src/test/resources/data
      # actually references — at that path so card lookups resolve real data
      # instead of an empty list.
      - name: Stage test card fixture
        run: mkdir -p static/secured && cp src/test/resources/data/cards/cards.json static/secured/cards.json
      # Plain `mvn test` never triggers Quinoa's build (that only runs as
      # part of quarkus:build/quarkus:dev or full packaging — see the
      # package job below), so this needs no Node/npm at all.
      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-check:
    name: Frontend checks (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm run test` (vitest run) runs both projects in vitest.config.ts —
      # the jsdom "unit" project and the "storybook" project, which executes
      # every *.stories.tsx play function in real Chromium via Playwright.
      # That browser isn't bundled with the npm deps, so install it (only
      # the e2e job did this before, which is why this job started failing
      # once the storybook project was added).
      - run: npx playwright install --with-deps chromium
      - run: npm run test
      # tsc -b + vite build — the same build Quinoa triggers as part of
      # `mvn package`, run here too so a type error or broken build fails
      # fast without needing a full Maven build to surface it.
      - run: npm run build

  package:
    name: Build the Quarkus app (bundles the built frontend in via Quinoa)
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      # Tests already ran in the two jobs above, so this only needs to prove
      # the packaging step itself — including Quinoa's frontend build —
      # still succeeds.
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
      # target/quarkus-app/ is the actual runnable artifact ("fast jar" mode,
      # Quarkus's default) — run it with `java -jar quarkus-app/quarkus-run.jar`.
      # Not target/jol.jar: that's the plain pre-Quarkus-augmentation jar,
      # not runnable standalone.
      - name: Upload runnable app
        uses: actions/upload-artifact@v4
        with:
          name: jol-quarkus-app
          path: target/quarkus-app/
          retention-days: 7

  # The end-to-end (Playwright) job was removed for now — it has never passed
  # in CI. Its webServer boots `./load-test-fixtures.sh && ./mvnw quarkus:dev`
  # and waits for https://localhost:8443/jol/login, but dev mode needs
  # src/main/resources/dev-keystore.p12 (gitignored) to bind 8443, and a
  # cold quarkus:dev start may also exceed the 180s webServer timeout.
  # Re-add once the dev keystore is provisioned in CI (generate via the
  # keytool command in application.properties) and the webServer step is
  # made observable (split fixture load into its own step; pipe stdout).
  # Specs still run locally with `npm run test:e2e` (see src/main/webui).
