name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  # Must match pom.xml's frontend-maven-plugin <nodeVersion> — that plugin
  # installs its own pinned Node for `mvn package`, but jobs below run plain
  # npm directly and need a matching one from setup-node instead.
  NODE_VERSION: '22.17.0'

jobs:
  backend-test:
    name: Backend tests (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Bound to prepare-package (see pom.xml's frontend-maven-plugin
      # comment), so this never touches Node/npm — that's covered by
      # frontend-check below.
      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-check:
    name: Frontend checks (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # tsc -b + vite build — the same build `mvn package` triggers via
      # frontend-maven-plugin, run here too so a type error or broken build
      # fails fast without needing a full Maven build to surface it.
      - run: npm run build

  package:
    name: Build WAR (bundles the built frontend into the WAR)
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # No setup-node here: frontend-maven-plugin installs its own pinned
      # Node (see pom.xml) as part of the build. Tests already ran in the
      # two jobs above, so this only needs to prove the packaging step
      # itself — including the frontend build + maven-war-plugin staging
      # target/react-dist into WEB-INF/../react/ — still succeeds.
      - name: Build WAR
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: jol-war
          path: target/jol.war
          retention-days: 7

  e2e:
    name: End-to-end tests (Playwright)
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # playwright.config.ts's webServer entries start both Tomcat (against
      # a disposable copy of the test fixture data, so this never touches
      # checked-in files — see frontend/README.md's Testing section) and the
      # Vite dev server themselves; first Tomcat boot here is a cold start
      # (fresh dependency resolution), hence the generous per-server timeout
      # already configured there.
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
