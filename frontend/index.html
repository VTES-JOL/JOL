<!doctype html>
<html lang="en" class="h-100 mh-100">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>V:TES Online</title>
    <!--
      The site's existing CSS (bootstrap.min.css, styles.css, ...) isn't part
      of the Vite project — it's served by Tomcat/nginx from webapp/css — so
      it's injected at runtime from src/legacyStyles.ts instead of linked here.
      Neither a plain leading-slash href nor %BASE_URL% survives both dev and
      build unchanged: dev's html middleware unconditionally prepends `base`
      to any leading-slash href/src (even one already produced by a %BASE_URL%
      substitution, doubling it), while build's transform only rewrites paths
      it can resolve as project assets, silently dropping /jol/ from ones it
      can't. import.meta.env.BASE_URL in JS is a plain string in both modes,
      with no attribute-rewriting involved — see legacyStyles.ts.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
    <link rel="shortcut icon" href="https://static.deckserver.net/assets/images/favicon.ico" />
    <link href="https://fonts.googleapis.com/css?family=IM+Fell+English" rel="stylesheet" />
  </head>
  <body class="h-100 mh-100 d-flex flex-column">
    <div id="root" class="d-flex flex-column h-100"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
